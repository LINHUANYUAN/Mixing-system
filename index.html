<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蛮巴适产品配比计算器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%96%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f7;
    --bg-grad: linear-gradient(180deg, #eef1f6 0%, #f4f5f7 240px);
    --card: #ffffff;
    --primary: #2b5acf;
    --primary-light: #e8eef9;
    --primary-dark: #1d4199;
    --accent: #1a1f36;
    --danger: #d6485a;
    --danger-light: #fde8ec;
    --success: #2e7d4f;
    --success-light: #e4f4ea;
    --warning: #c8810c;
    --warning-light: #fdf3e0;
    --border: #e3e6ec;
    --border-light: #eef0f4;
    --text: #1a1f36;
    --text-secondary: #4a5170;
    --text-muted: #8b91a7;
    --light-gray: #f8f9fb;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(26,31,54,0.05);
    --shadow: 0 2px 8px rgba(26,31,54,0.06), 0 1px 2px rgba(26,31,54,0.04);
    --shadow-lg: 0 8px 28px rgba(26,31,54,0.12), 0 2px 8px rgba(26,31,54,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    background-image: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.5;
    padding: 0; margin: 0;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* ===== 顶部栏 ===== */
  .header {
    background: var(--accent);
    color: #fff;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 4px 20px rgba(26,31,54,0.18);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .brand-logo {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, #4a73e8, #2b5acf);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(74,115,232,0.35);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: box-shadow 0.2s;
  }
  .brand-logo:active { box-shadow: 0 2px 12px rgba(74,115,232,0.5); }
  .brand-logo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .brand-logo .logo-placeholder { font-size: 18px; line-height: 1; }
  .brand-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .role-badge {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: #c8cee5;
    white-space: nowrap;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: inherit;
    font-weight: 500;
    transition: all 0.2s;
  }
  .role-badge:active { background: rgba(255,255,255,0.16); }
  .role-badge.admin { background: rgba(74,115,232,0.22); border-color: rgba(74,115,232,0.4); color: #aab8ef; }
  .icon-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: #c8cee5;
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    font-family: inherit;
  }
  .icon-btn:active { background: rgba(255,255,255,0.18); }
  /* ===== 主内容 ===== */
  .main { flex: 1; padding: 16px 16px 100px; }
  /* 卡片 */
  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    overflow: hidden;
    border: 1px solid var(--border-light);
  }
  .card-head {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-head h2 { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: 0.3px; }
  .card-body { padding: 6px 16px; }
  /* 配方选择 */
  .select-wrap { position: relative; }
  select.form-select {
    width: 100%;
    padding: 13px 36px 13px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path fill='none' stroke='%238b91a7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='M1 1l6 6 6-6'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    transition: border-color 0.2s;
  }
  select.form-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  /* ===== 原料行 ===== */
  .ingredient-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-light);
    transition: background 0.2s;
  }
  .ingredient-row:last-child { border-bottom: none; }
  .ing-index {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--light-gray);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ing-label {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    word-break: break-all;
    min-width: 0;
  }
  .ing-input-group {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .ing-input {
    width: 88px;
    padding: 8px 8px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    text-align: right;
    color: var(--text);
    background: #fff;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  .ing-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  /* 编辑态（未确认）高亮 */
  .ingredient-row.edited .ing-input {
    border-color: var(--warning);
    background: var(--warning-light);
    box-shadow: 0 0 0 3px rgba(200,129,12,0.12);
  }
  /* 确认按钮 */
  .ing-confirm {
    width: 32px; height: 32px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    font-family: inherit;
  }
  .ingredient-row.edited .ing-confirm {
    border-color: var(--success);
    color: #fff;
    background: var(--success);
    box-shadow: 0 2px 6px rgba(46,125,79,0.3);
  }
  /* 基准编辑模式：原料名称输入框 */
  .ing-name-input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    background: #fff;
    font-family: inherit;
  }
  .ing-name-input:focus { outline: none; border-color: var(--primary); border-style: solid; box-shadow: 0 0 0 3px var(--primary-light); }
  /* 编辑模式下的数值框 */
  .ingredient-row.editing .ing-input {
    border-style: dashed;
    background: var(--light-gray);
  }
  /* 编辑基准按钮激活态 */
  #btnEditBase.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .ing-unit { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .ing-delete {
    width: 28px; height: 28px;
    border: none; background: transparent;
    color: var(--danger);
    font-size: 18px; cursor: pointer;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .ing-delete:active { background: var(--danger-light); }
  .ing-lock {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all 0.15s;
  }
  .ing-lock:active { background: var(--border-light); }
  .ing-lock.locked { color: var(--success); background: var(--success-light); }
  .ratio-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    color: var(--success);
    background: var(--success-light);
    padding: 2px 7px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 0.3px;
  }
  /* ===== 按钮 ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 16px;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    font-family: inherit;
    letter-spacing: 0.3px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(43,90,207,0.25); }
  .btn-primary:active { background: var(--primary-dark); }
  .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn-outline:active { background: var(--primary-light); }
  .btn-ghost { background: var(--light-gray); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-ghost:active { background: var(--border-light); }
  .btn-danger { background: #fff; color: var(--danger); border: 1.5px solid var(--danger); }
  .btn-danger:active { background: var(--danger-light); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 7px 12px; font-size: 13px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  /* 工具栏 */
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .toolbar .btn { flex: 1; min-width: 0; }
  /* 提示条 */
  .hint {
    font-size: 12.5px;
    color: var(--text-secondary);
    padding: 10px 14px;
    background: var(--primary-light);
    border-radius: var(--radius);
    margin-bottom: 12px;
    line-height: 1.55;
    border: 1px solid rgba(43,90,207,0.08);
  }
  .hint.warn { background: var(--warning-light); color: var(--warning); border-color: rgba(200,129,12,0.12); }
  /* 统计条 */
  .stat-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }
  .stat-item {
    flex: 1;
    background: var(--card);
    border-radius: var(--radius);
    padding: 10px 14px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
  }
  .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 20px; font-weight: 700; color: var(--text); margin-top: 2px; }
  .stat-value .unit { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-left: 2px; }
  /* 空状态 */
  .empty {
    text-align: center;
    padding: 36px 16px;
    color: var(--text-muted);
    font-size: 14px;
  }
  /* ===== 底部操作栏 ===== */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.96);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    display: none;
    gap: 8px;
    z-index: 50;
    max-width: 600px;
    margin: 0 auto;
  }
  .bottom-bar.show { display: flex; }
  .bottom-bar .btn { flex: 1; }
  /* ===== 模态框 ===== */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(26,31,54,0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 18px;
    width: 100%;
    max-width: 390px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: modalIn 0.25s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-head {
    padding: 18px 18px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-head h3 { font-size: 17px; font-weight: 700; }
  .modal-body { padding: 0 18px 18px; }
  .modal-foot {
    padding: 12px 18px 18px;
    display: flex;
    gap: 8px;
  }
  .modal-foot .btn { flex: 1; }
  .form-group { margin-bottom: 14px; }
  .form-group:last-child { margin-bottom: 0; }
  .form-group label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-size: 15px;
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .share-link-box {
    background: var(--light-gray);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 12px;
    word-break: break-all;
    color: var(--text-secondary);
    margin-top: 8px;
    font-family: "SF Mono", Monaco, monospace;
    line-height: 1.5;
  }
  /* Toast */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    padding: 11px 22px;
    border-radius: 24px;
    font-size: 13.5px;
    font-weight: 500;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.3s, bottom 0.3s;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; bottom: 106px; }
  /* 致命错误兜底 */
  .fatal-error {
    margin: 16px;
    padding: 16px;
    background: var(--danger-light);
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    color: var(--danger);
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
  }
  /* 切换提示动画 */
  @keyframes flash {
    0% { background: var(--primary-light); }
    100% { background: #fff; }
  }
  .flash { animation: flash 0.6s ease; }
  /* PC 适配 */
  @media (min-width: 601px) {
    body { background: #eaecf2; background-image: linear-gradient(180deg, #e6e9f2 0%, #eaecf2 280px); }
    .app { box-shadow: 0 0 40px rgba(26,31,54,0.1); }
    .bottom-bar { left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; }
  }
  /* 小屏优化 */
  @media (max-width: 360px) {
    .ing-input { width: 74px; font-size: 14px; }
    .ing-label { font-size: 14px; }
    .brand-title { font-size: 14px; }
    .brand-logo { width: 30px; height: 30px; font-size: 16px; }
    .main { padding: 12px 12px 100px; }
  }
  /* 备份与恢复弹窗（复制粘贴式备份码） */
  .backup-block { margin-bottom: 4px; }
  .backup-label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .backup-code {
    width: 100%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    background: var(--light-gray);
    color: var(--text);
    word-break: break-all;
  }
  .backup-actions { display: flex; gap: 8px; margin-top: 8px; }
  .backup-divider { display: flex; align-items: center; color: var(--text-muted); font-size: 12px; margin: 14px 0; }
  .backup-divider::before, .backup-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .backup-divider span { padding: 0 10px; }
  /* 删除确认（三次倒计时） */
  .del-warn {
    background: var(--danger-light);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: var(--radius);
    padding: 14px;
    font-size: 14px;
    line-height: 1.6;
    font-weight: 600;
  }
  .del-step { margin-top: 10px; color: var(--text-muted); font-size: 13px; text-align: center; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部栏 -->
  <div class="header">
    <div class="brand">
      <div class="brand-logo" id="brandLogo" title="点击上传自定义Logo">
        <span class="logo-placeholder">⚖</span>
      </div>
      <div class="brand-title">蛮巴适产品配比计算器</div>
    </div>
    <div class="header-actions">
      <button class="role-badge" id="roleBadge" title="点击切换身份">员工</button>
      <button class="icon-btn" id="btnShare" title="分享" aria-label="分享">⤴</button>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="main">
    <!-- 配方选择 -->
    <div class="card">
      <div class="card-body" style="padding:12px 16px">
        <div class="select-wrap">
          <select id="recipeSelect" class="form-select"></select>
        </div>
      </div>
    </div>

    <!-- 统计条 -->
    <div class="stat-bar">
      <div class="stat-item">
        <div class="stat-label">原料</div>
        <div class="stat-value" id="statCount">0<span class="unit">种</span></div>
      </div>
      <div class="stat-item">
        <div class="stat-label">总重</div>
        <div class="stat-value" id="statTotal">0<span class="unit">g</span></div>
      </div>
    </div>

    <!-- 操作工具栏 -->
    <div class="toolbar" id="adminToolbar">
      <button class="btn btn-ghost btn-sm" id="btnNewRecipe">＋ 新建配方</button>
      <button class="btn btn-ghost btn-sm" id="btnAddIng">＋ 添加原料</button>
      <button class="btn btn-ghost btn-sm" id="btnEditBase">✎ 编辑基准</button>
    </div>

    <div class="hint" id="hintBox">
      修改数值后点击 ✓（或按回车）确认，其余原料自动按比例换算。点击 🔒 可锁定基准项。
    </div>

    <!-- 原料面板 -->
    <div class="card">
      <div class="card-head">
        <h2 id="recipeTitle">配方</h2>
        <span id="recipeMeta" style="font-size:12px;color:var(--text-muted);font-weight:600"></span>
      </div>
      <div class="card-body" id="ingredientList">
        <!-- 动态生成 -->
      </div>
    </div>

    <!-- 管理员保存提示 -->
    <div class="hint warn" id="dirtyHint" style="display:none">
      有未保存的修改，请点击底部"保存配方"。
    </div>
  </div>

  <!-- 底部操作栏 -->
  <div class="bottom-bar" id="bottomBar">
    <button class="btn btn-primary" id="btnSave">💾 保存配方</button>

<script>
(function(){
  'use strict';

  // ====== 常量 ======
  var STORAGE_KEY = 'recipe_calculator_v1';
  var LOGO_KEY = 'recipe_calculator_logo';
  var STORAGE_VERSION_KEY = 'recipe_calculator_preset_v1';
  var BUILTIN_IDS = ['lvdousha']; // 当前合法的内置配方ID，用于清理旧版本残留
  var BACKUP_PREFIX = '蛮巴适配比备份';
  var PARAM_ROLE = 'role';
  var ROLE_ADMIN = 'admin';
  var ROLE_STAFF = 'staff';

  // ====== 预置配方（仅绿豆沙） ======
  var DEFAULT_RECIPES = [
    {
      id: 'lvdousha',
      name: '绿豆沙',
      builtin: true,
      ingredients: [
        { name: '绿豆', amount: 1000 },
        { name: '冰糖', amount: 1000 },
        { name: '水',   amount: 5000 },
        { name: '冰块', amount: 9000 }
      ]
    }
  ];

  // ====== 共享预设（发布到 GitHub Pages 后，所有访客看到的默认配方）======
  // 想让线上版本显示你自己的配方？把配方填进 PRESET_RECIPES，并把 PRESET_VERSION 加 1，
  // 重新发布后，所有访客（含已有旧数据的访客）都会更新为这里的配方。
  var PRESET_VERSION = 1;
  var PRESET_RECIPES = [
    {
      id: 'lvdousha',
      name: '绿豆沙',
      builtin: true,
      ingredients: [
        { name: '绿豆', amount: 1000 },
        { name: '冰糖', amount: 1000 },
        { name: '水',   amount: 5000 },
        { name: '冰块', amount: 9000 }
      ]
    }
    // 例：在这里继续添加你自己的配方（去掉前面的 // 即可）
    // ,{
    //   id: 'huashengsha',
    //   name: '花生沙',
    //   builtin: true,
    //   ingredients: [
    //     { name: '花生', amount: 1000 },
    //     { name: '冰糖', amount: 600 }
    //   ]
    // }
  ];

  // ====== 状态 ======
  var state = {
    role: ROLE_STAFF,
    recipes: [],
    currentId: null,
    lockedIndex: 0,
    editMode: false,
    dirty: false
  };

  // ====== DOM ======
  var $ = function(id){ return document.getElementById(id); };
  var recipeSelect = $('recipeSelect');
  var recipeTitle  = $('recipeTitle');
  var recipeMeta   = $('recipeMeta');
  var ingredientList = $('ingredientList');
  var roleBadge    = $('roleBadge');
  var hintBox      = $('hintBox');
  var dirtyHint    = $('dirtyHint');
  var adminToolbar = $('adminToolbar');
  var bottomBar    = $('bottomBar');
  var statCount    = $('statCount');
  var statTotal    = $('statTotal');

  // ====== 工具函数 ======
  function getParam(name){
    var m = new RegExp('[?&]'+name+'=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function save(){
    var data = { recipes: state.recipes, currentId: state.currentId };
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      localStorage.setItem(STORAGE_VERSION_KEY, String(PRESET_VERSION));
    } catch(e){}
  }
  function load(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var data = JSON.parse(raw);
        if(data && data.recipes){ return data; }
      }
    } catch(e){}
    return null;
  }
  function round(n){ return Math.round(n); }
  function genId(){
    return 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
  }
  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }
  function showModal(id){ $(id).classList.add('show'); }
  function hideModal(id){ $(id).classList.remove('show'); }

  // 致命错误兜底：避免页面"只有标题、内容空白"时无从排查
  function showFatal(err){
    var box = document.getElementById('fatalError');
    if(box){
      box.style.display = 'block';
      box.textContent = '页面加载出错：' + (err && err.message ? err.message : String(err));
    }
    if(window.console) console.error(err);
  }

  // ====== 初始化 ======
  function init(){
   try {
    var r = getParam(PARAM_ROLE);
    state.role = (r === ROLE_STAFF) ? ROLE_STAFF : ROLE_ADMIN;

    var saved = load();
    var storedVer = 0;
    try { storedVer = parseInt(localStorage.getItem(STORAGE_VERSION_KEY) || '0', 10) || 0; } catch(e){}

    if(saved && saved.recipes && saved.recipes.length && storedVer >= PRESET_VERSION){
      // 已有本地数据且共享预设未更新：沿用用户自己的状态
      state.recipes = migrateRecipes(saved.recipes);
      state.currentId = saved.currentId || (state.recipes[0] && state.recipes[0].id);
      save();
    } else {
      // 首次访问，或共享预设已更新：以 PRESET_RECIPES 为基准
      var base = JSON.parse(JSON.stringify(PRESET_RECIPES));
      // 保留用户此前自建的配方，避免更新预设时把自建配方冲掉
      if(saved && saved.recipes){
        saved.recipes.forEach(function(r){ if(!r.builtin) base.push(r); });
      }
      state.recipes = migrateRecipes(base);
      state.currentId = (saved && saved.currentId && getRecipeById(state.recipes, saved.currentId))
        ? saved.currentId : (state.recipes[0] && state.recipes[0].id);
      save();
      try { localStorage.setItem(STORAGE_VERSION_KEY, String(PRESET_VERSION)); } catch(e){}
    }
    if(!state.currentId || !getRecipeById(state.recipes, state.currentId)){
      state.currentId = state.recipes[0] && state.recipes[0].id;
    }

    applyRole();
    renderRecipeSelect();
    renderCurrent();
    loadLogo();
    bindEvents();
   } catch(err){
    showFatal(err);
   }
  }

  // ====== Logo 自定义 ======
  function loadLogo(){
    try {
      var dataUrl = localStorage.getItem(LOGO_KEY);
      if(dataUrl){
        setLogoImage(dataUrl);
      }
    } catch(e){}
  }
  function setLogoImage(dataUrl){
    var logoEl = $('brandLogo');
    logoEl.innerHTML = '<img src="' + dataUrl + '" alt="Logo">';
  }
  function handleLogoUpload(file){
    if(!file || !file.type.startsWith('image/')){
      toast('请选择图片文件');
      return;
    }
    if(file.size > 1024 * 1024){
      toast('图片不能超过 1MB');
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
      var dataUrl = e.target.result;
      // 用 canvas 压缩到 80x80，减少存储体积
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement('canvas');
        canvas.width = 80; canvas.height = 80;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 80, 80);
        var compressed = canvas.toDataURL('image/png');
        try {
          localStorage.setItem(LOGO_KEY, compressed);
          setLogoImage(compressed);
          toast('Logo 已更新');
        } catch(err){
          // 存储满 → 直接用原图
          try {
            localStorage.setItem(LOGO_KEY, dataUrl);
            setLogoImage(dataUrl);
            toast('Logo 已更新');
          } catch(e2){
            toast('存储空间不足，无法保存Logo');
          }
        }
      };
      img.src = dataUrl;
    };
    reader.onerror = function(){ toast('图片读取失败'); };
    reader.readAsDataURL(file);
  }

  function applyRole(){
    var isAdmin = state.role === ROLE_ADMIN;
    roleBadge.innerHTML = isAdmin ? '🛠 管理员 ⇄' : '👤 员工 ⇄';
    roleBadge.title = isAdmin ? '当前：管理员，点击切换为员工' : '当前：员工，点击切换为管理员';
    roleBadge.classList.toggle('admin', isAdmin);
    adminToolbar.style.display = isAdmin ? 'flex' : 'none';
    bottomBar.classList.toggle('show', isAdmin);
    if(!isAdmin) state.editMode = false;
    updateEditBtn();
    updateHint();
  }

  function restoreSavedData(){
    var saved = load();
    if(saved && saved.recipes){
      state.recipes = saved.recipes;
      if(!getRecipe(state.currentId)) state.currentId = state.recipes[0].id;
    }
    state.dirty = false;
    dirtyHint.style.display = 'none';
  }

  function toggleRole(){
    if(state.editMode && state.dirty){
      if(!confirm('有未保存的修改，切换身份将丢失，确定切换？')) return;
      restoreSavedData();
    }
    state.editMode = false;
    state.role = (state.role === ROLE_ADMIN) ? ROLE_STAFF : ROLE_ADMIN;
    applyRole();
    renderCurrent();
    toast(state.role === ROLE_ADMIN ? '已切换为管理员' : '已切换为员工');
  }

  function updateHint(){
    var isAdmin = state.role === ROLE_ADMIN;
    if(!isAdmin){
      hintBox.textContent = '当前为只读模式：可切换配方、执行换算。修改数值后点击 ✓ 或按回车确认换算，不能保存基准。';
    } else if(state.editMode){
      hintBox.textContent = '基准编辑模式：直接修改原料名称与克数（单项生效、不联动换算），改完点底部"保存配方"。';
    } else {
      hintBox.textContent = '修改数值后点击 ✓（或按回车）确认，其余原料自动按比例换算。点击 🔒 可锁定基准项。';
    }
  }

  function updateEditBtn(){
    var btn = $('btnEditBase');
    if(!btn) return;
    btn.classList.toggle('active', !!state.editMode);
    btn.textContent = state.editMode ? '✎ 编辑中…' : '✎ 编辑基准';
  }

  function getRecipe(id){
    for(var i=0;i<state.recipes.length;i++){
      if(state.recipes[i].id === id) return state.recipes[i];
    }
    return null;
  }

  // 数据迁移：清理旧版本残留的废弃内置配方，空了则补回预设
  function migrateRecipes(recipes){
    var out = recipes.filter(function(r){
      if(r.builtin && BUILTIN_IDS.indexOf(r.id) === -1) return false;
      return true;
    });
    if(out.length === 0){ out = JSON.parse(JSON.stringify(PRESET_RECIPES)); }
    return out;
  }

  // ====== 渲染 ======
  function renderRecipeSelect(){
    var html = '';
    state.recipes.forEach(function(r){
      html += '<option value="'+r.id+'">'+escapeHtml(r.name)+(r.builtin?'':' (自建)')+'</option>';
    });
    recipeSelect.innerHTML = html;
    recipeSelect.value = state.currentId;
  }

  function updateStats(recipe){
    if(!recipe){ statCount.innerHTML = '0<span class="unit">种</span>'; statTotal.innerHTML = '0<span class="unit">g</span>'; return; }
    var total = 0;
    recipe.ingredients.forEach(function(ing){ total += ing.amount; });
    statCount.innerHTML = recipe.ingredients.length + '<span class="unit">种</span>';
    statTotal.innerHTML = total.toLocaleString() + '<span class="unit">g</span>';
  }

  function renderCurrent(){
    var recipe = getRecipe(state.currentId);
    if(!recipe){
      ingredientList.innerHTML = '<div class="empty">请选择配方</div>';
      recipeTitle.textContent = '—';
      recipeMeta.textContent = '';
      updateStats(null);
      return;
    }
    recipeTitle.textContent = recipe.name;
    recipeMeta.textContent = recipe.ingredients.length + ' 种原料';
    renderIngredients(recipe);
    updateStats(recipe);
    state.dirty = false;
    dirtyHint.style.display = 'none';
  }

  function renderIngredients(recipe){
    var isAdmin = state.role === ROLE_ADMIN;
    var editMode = isAdmin && state.editMode;
    var html = '';
    if(state.lockedIndex >= recipe.ingredients.length) state.lockedIndex = 0;

    recipe.ingredients.forEach(function(ing, idx){
      var locked = (idx === state.lockedIndex);
      if(editMode){
        html += '<div class="ingredient-row editing">';
        html += '  <input type="text" class="ing-name-input" data-name="'+idx+'" value="'+escapeHtml(ing.name)+'" maxlength="12" placeholder="原料名">';
        html += '  <div class="ing-input-group">';
        html += '    <input type="number" class="ing-input" data-idx="'+idx+'" value="'+ing.amount+'" min="0" step="any" inputmode="decimal">';
        html += '    <span class="ing-unit">g</span>';
        html += '    <button class="ing-delete" data-del="'+idx+'" title="删除原料">×</button>';
        html += '  </div>';
        html += '</div>';
      } else {
        html += '<div class="ingredient-row">';
        html += '  <div class="ing-index">'+(idx+1)+'</div>';
        html += '  <div class="ing-label">' + escapeHtml(ing.name);
        if(locked) html += ' <span class="ratio-tag">基准</span>';
        html += '</div>';
        html += '  <div class="ing-input-group">';
        html += '    <input type="number" class="ing-input" data-idx="'+idx+'" value="'+ing.amount+'" min="0" step="any" inputmode="decimal">';
        html += '    <span class="ing-unit">g</span>';
        html += '    <button class="ing-confirm" data-ok="'+idx+'" title="确认换算">✓</button>';
        if(isAdmin){
          html += '  <button class="ing-lock'+(locked?' locked':'')+'" data-lock="'+idx+'" title="'+(locked?'取消锁定':'设为基准')+'">'+(locked?'🔒':'🔓')+'</button>';
          html += '  <button class="ing-delete" data-del="'+idx+'" title="删除原料">×</button>';
        } else {
          html += '  <span class="ing-lock'+(locked?' locked':'')+'" data-lock="'+idx+'" title="'+(locked?'基准项':'点击设为基准')+'" style="cursor:pointer">'+(locked?'🔒':'🔓')+'</span>';
        }
        html += '  </div>';
        html += '</div>';
      }
    });

    if(recipe.ingredients.length === 0){
      html = '<div class="empty">暂无原料，请点击"添加原料"</div>';
    }
    ingredientList.innerHTML = html;
    updateStats(recipe);

    if(editMode){
      bindEditEvents();
    } else {
      bindCalcEvents();
    }
    var dels = ingredientList.querySelectorAll('[data-del]');
    dels.forEach(function(b){ b.addEventListener('click', onDeleteIng); });
  }

  // ===== 换算模式事件 =====
  function bindCalcEvents(){
    var inputs = ingredientList.querySelectorAll('.ing-input');
    inputs.forEach(function(inp){
      inp.addEventListener('input', markEdited);
      inp.addEventListener('focus', function(){ this.select(); });
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); confirmInput(parseInt(this.getAttribute('data-idx'),10), this); }
      });
      inp.addEventListener('blur', function(){
        var el = this;
        setTimeout(function(){
          if(!document.body.contains(el)) return;
          var row = el.closest('.ingredient-row');
          if(row && row.classList.contains('edited')){
            var recipe = getRecipe(state.currentId);
            if(recipe) renderIngredients(recipe);
          }
        }, 150);
      });
    });
    var oks = ingredientList.querySelectorAll('.ing-confirm');
    oks.forEach(function(btn){
      btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
      btn.addEventListener('click', function(){
        var idx = parseInt(this.getAttribute('data-ok'), 10);
        var inp = ingredientList.querySelector('.ing-input[data-idx="'+idx+'"]');
        if(inp) confirmInput(idx, inp);
      });
    });
    var locks = ingredientList.querySelectorAll('[data-lock]');
    locks.forEach(function(b){ b.addEventListener('click', onLock); });
  }

  // ===== 基准编辑模式事件 =====
  function bindEditEvents(){
    var inputs = ingredientList.querySelectorAll('.ing-input');
    inputs.forEach(function(inp){
      inp.addEventListener('focus', function(){ this.select(); });
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); this.blur(); }
      });
      inp.addEventListener('blur', function(){
        var el = this;
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        setTimeout(function(){
          if(!document.body.contains(el)) return;
          var recipe = getRecipe(state.currentId);
          if(!recipe || !recipe.ingredients[idx]) return;
          var v = parseFloat(el.value);
          if(el.value === '' || isNaN(v) || v < 0){ el.value = recipe.ingredients[idx].amount; return; }
          v = round(v);
          if(v !== recipe.ingredients[idx].amount){
            recipe.ingredients[idx].amount = v;
            markDirty();
            el.value = v;
            updateStats(recipe);
          }
        }, 100);
      });
    });
    var names = ingredientList.querySelectorAll('.ing-name-input');
    names.forEach(function(inp){
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); this.blur(); }
      });
      inp.addEventListener('blur', function(){
        var el = this;
        var idx = parseInt(el.getAttribute('data-name'), 10);
        setTimeout(function(){
          if(!document.body.contains(el)) return;
          var recipe = getRecipe(state.currentId);
          if(!recipe || !recipe.ingredients[idx]) return;
          var n = el.value.trim();
          if(!n){ el.value = recipe.ingredients[idx].name; return; }
          if(n !== recipe.ingredients[idx].name){
            var dup = recipe.ingredients.some(function(ing, i){ return i !== idx && ing.name === n; });
            if(dup){ toast('已存在同名原料「'+n+'」'); el.value = recipe.ingredients[idx].name; return; }
            recipe.ingredients[idx].name = n;
            markDirty();
          }
        }, 100);
      });
    });
  }

  function markDirty(){
    state.dirty = true;
    if(state.role === ROLE_ADMIN) dirtyHint.style.display = 'block';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ====== 比例换算核心 ======
  function markEdited(e){
    var row = e.target.closest('.ingredient-row');
    if(row) row.classList.add('edited');
  }

  function confirmInput(idx, inputEl){
    var recipe = getRecipe(state.currentId);
    if(!recipe) return;
    var baseIng = recipe.ingredients[idx];
    if(!baseIng) return;

    var raw = inputEl.value;
    var newVal = parseFloat(raw);

    if(raw === '' || isNaN(newVal) || newVal < 0 || newVal === baseIng.amount){
      renderIngredients(recipe);
      return;
    }
    newVal = round(newVal);
    if(newVal === 0 && baseIng.amount === 0){
      renderIngredients(recipe);
      return;
    }

    var oldVal = baseIng.amount;
    if(oldVal === 0){
      baseIng.amount = newVal;
      state.lockedIndex = idx;
    } else {
      var ratio = newVal / oldVal;
      recipe.ingredients.forEach(function(ing, i){
        if(i === idx){ ing.amount = newVal; }
        else { ing.amount = round(ing.amount * ratio); if(ing.amount < 0) ing.amount = 0; }
      });
      state.lockedIndex = idx;
    }

    state.dirty = true;
    if(state.role === ROLE_ADMIN) dirtyHint.style.display = 'block';
    renderIngredients(recipe);
    toast('已按比例换算');
  }

  function onLock(e){
    var idx = parseInt(e.currentTarget.getAttribute('data-lock'), 10);
    var recipe = getRecipe(state.currentId);
    if(!recipe) return;
    state.lockedIndex = (state.lockedIndex === idx) ? 0 : idx;
    renderIngredients(recipe);
  }

  function onDeleteIng(e){
    var idx = parseInt(e.currentTarget.getAttribute('data-del'), 10);
    var recipe = getRecipe(state.currentId);
    if(!recipe) return;
    if(recipe.builtin && recipe.ingredients.length <= 1){ toast('内置配方至少保留1种原料'); return; }
    if(!confirm('确定删除原料「'+recipe.ingredients[idx].name+'」？')) return;
    recipe.ingredients.splice(idx, 1);
    if(state.lockedIndex >= recipe.ingredients.length) state.lockedIndex = 0;
    state.dirty = true;
    dirtyHint.style.display = 'block';
    renderIngredients(recipe);
  }

  // ====== 备份码编解码（复制粘贴式）======
  var BACKUP_CODE_PREFIX = 'MBS1:';
  function utf8ToB64(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64ToUtf8(b64){ return decodeURIComponent(escape(atob(b64))); }
  function tryParse(str){ try { return JSON.parse(str); } catch(e){ return null; } }

  // 生成可复制的备份码：前缀 + base64(JSON)
  function buildBackupCode(){
    var logoData = null;
    try { logoData = localStorage.getItem(LOGO_KEY); } catch(e){}
    var data = {
      app: '蛮巴适产品配比计算器',
      version: 1,
      exportTime: new Date().toISOString(),
      recipes: state.recipes,
      currentId: state.currentId,
      logo: logoData
    };
    return BACKUP_CODE_PREFIX + utf8ToB64(JSON.stringify(data));
  }

  // 解析备份码：兼容 前缀+base64（新版）、纯 base64、以及旧版纯 JSON 文件
  function parseBackupCode(raw){
    if(!raw) return null;
    var s = String(raw).replace(/\s+/g, '');
    if(s.indexOf(BACKUP_CODE_PREFIX) === 0) s = s.slice(BACKUP_CODE_PREFIX.length);
    var data = tryParse(s) || tryParse(String(raw)); // 1) 直接 JSON（旧文件）
    if(!data){
      try { data = tryParse(b64ToUtf8(s)); } catch(e){} // 2) base64（新版备份码）
    }
    if(!data || !data.recipes || !Array.isArray(data.recipes) || data.recipes.length === 0) return null;
    var valid = data.recipes.every(function(r){
      return r && typeof r.name === 'string' && Array.isArray(r.ingredients);
    });
    if(!valid) return null;
    return data;
  }

  // 应用导入数据（备份码与文件导入共用）
  function applyImportData(data){
    state.recipes = data.recipes;
    state.currentId = data.currentId && getRecipeById(state.recipes, data.currentId) ? data.currentId : state.recipes[0].id;
    state.lockedIndex = 0;
    state.editMode = false;
    state.dirty = false;
    save();
    if(data.logo){
      try { localStorage.setItem(LOGO_KEY, data.logo); setLogoImage(data.logo); } catch(e){}
    }
    applyRole();
    renderRecipeSelect();
    renderCurrent();
    dirtyHint.style.display = 'none';
    toast('备份导入成功，共 ' + data.recipes.length + ' 套配方');
  }

  // ====== 导出备份（下载文件，作为备选）======
  function exportBackup(){
    var logoData = null;
    try { logoData = localStorage.getItem(LOGO_KEY); } catch(e){}
    var data = {
      app: '蛮巴适产品配比计算器',
      version: 1,
      exportTime: new Date().toISOString(),
      recipes: state.recipes,
      currentId: state.currentId,
      logo: logoData
    };
    var json = JSON.stringify(data, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var d = new Date();
    var stamp = d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2) + '_' + ('0'+d.getHours()).slice(-2) + ('0'+d.getMinutes()).slice(-2);
    var filename = BACKUP_PREFIX + '_' + stamp + '.json';
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 100);
    toast('备份已导出：' + filename);
  }

  // ====== 导入备份（文件，作为备选）======
  function importBackup(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var data = parseBackupCode(e.target.result);
      if(!data){ toast('备份文件格式无效'); return; }
      if(!confirm('将导入 ' + data.recipes.length + ' 套配方，会覆盖当前所有数据，确定导入？')) return;
      applyImportData(data);
    };
    reader.onerror = function(){ toast('文件读取失败'); };
    reader.readAsText(file);
  }

  function getRecipeById(recipes, id){
    for(var i=0;i<recipes.length;i++){ if(recipes[i].id === id) return recipes[i]; }
    return null;
  }

  // ====== 事件绑定 ======
  function bindEvents(){
    // 配方切换
    recipeSelect.addEventListener('change', function(){
      if(state.editMode && state.dirty){
        if(!confirm('当前配方有未保存的修改，切换将丢失，确定切换？')){
          recipeSelect.value = state.currentId;
          return;
        }
        restoreSavedData();
      }
      state.currentId = recipeSelect.value;
      if(!getRecipe(state.currentId)) state.currentId = state.recipes[0].id;
      state.lockedIndex = 0;
      save();
      renderRecipeSelect();
      renderCurrent();
      flashCard();
    });

    // 角色切换
    $('roleBadge').addEventListener('click', toggleRole);

    // Logo 上传（管理员可上传自定义Logo，员工点击无效）
    $('brandLogo').addEventListener('click', function(){
      if(state.role !== ROLE_ADMIN){
        toast('仅管理员可上传Logo');
        return;
      }
      $('logoFile').click();
    });
    $('logoFile').addEventListener('change', function(e){
      var file = e.target.files[0];
      if(file) handleLogoUpload(file);
      e.target.value = '';
    });

    // 编辑基准模式
    $('btnEditBase').addEventListener('click', function(){
      if(state.role !== ROLE_ADMIN) return;
      var recipe = getRecipe(state.currentId);
      if(!recipe) return;
      if(!state.editMode){
        if(state.dirty){ restoreSavedData(); toast('已恢复为已保存的基准数据'); }
      } else {
        if(state.dirty){
          if(!confirm('有未保存的修改，退出将丢失，确定退出？')) return;
          restoreSavedData();
        }
      }
      state.editMode = !state.editMode;
      updateEditBtn();
      updateHint();
      renderRecipeSelect();
      renderCurrent();
    });

    // 新建配方
    $('btnNewRecipe').addEventListener('click', function(){
      $('newRecipeName').value = '';
      $('newRecipeItems').value = '';
      showModal('modalNewRecipe');
      setTimeout(function(){ $('newRecipeName').focus(); }, 100);
    });
    $('btnConfirmNew').addEventListener('click', function(){
      var name = $('newRecipeName').value.trim();
      if(!name){ toast('请输入配方名称'); return; }
      var itemsText = $('newRecipeItems').value.trim();
      var ings = [];
      if(itemsText){
        var lines = itemsText.split(/\n+/);
        lines.forEach(function(line){
          var parts = line.split(/[,，]/);
          if(parts.length >= 2){
            var n = parts[0].trim();
            var a = parseFloat(parts[1]);
            if(n && !isNaN(a) && a >= 0){ ings.push({ name: n, amount: a }); }
          }
        });
      }
      if(ings.length === 0){ toast('请至少输入一项原料，格式：名称,克数'); return; }
      var recipe = { id: genId(), name: name, builtin: false, ingredients: ings };
      state.recipes.push(recipe);
      state.currentId = recipe.id;
      state.lockedIndex = 0;
      save();
      renderRecipeSelect();
      renderCurrent();
      hideModal('modalNewRecipe');
      toast('配方「'+name+'」已创建');
    });

    // 添加原料
    $('btnAddIng').addEventListener('click', function(){
      $('newIngName').value = '';
      $('newIngAmount').value = '';
      showModal('modalAddIng');
      setTimeout(function(){ $('newIngName').focus(); }, 100);
    });
    $('btnConfirmAddIng').addEventListener('click', function(){
      var name = $('newIngName').value.trim();
      var amt  = parseFloat($('newIngAmount').value);
      if(!name){ toast('请输入原料名称'); return; }
      if(isNaN(amt) || amt < 0){ toast('请输入有效克数'); return; }
      var recipe = getRecipe(state.currentId);
      if(!recipe) return;
      for(var i=0;i<recipe.ingredients.length;i++){
        if(recipe.ingredients[i].name === name){ toast('该原料已存在'); return; }
      }
      recipe.ingredients.push({ name: name, amount: amt });
      state.dirty = true;
      dirtyHint.style.display = 'block';
      renderIngredients(recipe);
      hideModal('modalAddIng');
      toast('已添加「'+name+'」');
    });

    // 保存
    $('btnSave').addEventListener('click', function(){
      var recipe = getRecipe(state.currentId);
      if(!recipe) return;
      recipe.ingredients.forEach(function(ing){ ing.amount = round(ing.amount); });
      save();
      state.dirty = false;
      dirtyHint.style.display = 'none';
      if(state.editMode){ state.editMode = false; updateEditBtn(); updateHint(); }
      renderIngredients(recipe);
      toast('配方已保存');
    });

    // 删除配方（三次提醒倒计时，防误删）
    var delTimer = null, delStep = 0;
    function clearDelTimer(){ if(delTimer){ clearInterval(delTimer); delTimer = null; } }
    function startDelCountdown(){
      delStep = 1;
      runDelStep();
    }
    function runDelStep(){
      var btn = $('btnConfirmDelete');
      var secs = 3;
      btn.disabled = true;
      btn.textContent = '请等待 ' + secs + ' 秒…';
      $('delStep').textContent = '第 ' + delStep + ' / 3 次确认';
      var r = getRecipe(state.currentId);
      $('delWarn').textContent = '即将删除配方「' + (r ? r.name : '') + '」，此操作不可恢复！';
      clearDelTimer();
      delTimer = setInterval(function(){
        secs--;
        if(secs <= 0){
          clearDelTimer();
          btn.disabled = false;
          btn.textContent = '确认删除（第 ' + delStep + ' 次）';
        } else {
          btn.textContent = '请等待 ' + secs + ' 秒…';
        }
      }, 1000);
    }
    $('btnDelete').addEventListener('click', function(){
      var recipe = getRecipe(state.currentId);
      if(!recipe) return;
      if(recipe.builtin){ toast('内置配方不可删除'); return; }
      if(state.recipes.length <= 1){ toast('至少保留一套配方'); return; }
      showModal('modalDelete');
      startDelCountdown();
    });
    $('btnConfirmDelete').addEventListener('click', function(){
      if(delStep < 3){
        delStep++;
        runDelStep();
        return;
      }
      // 第三次确认：执行删除
      clearDelTimer();
      var recipe = getRecipe(state.currentId);
      if(recipe){
        var idx = state.recipes.indexOf(recipe);
        state.recipes.splice(idx, 1);
        state.currentId = state.recipes[Math.max(0, idx-1)].id;
        state.lockedIndex = 0;
        save();
        renderRecipeSelect();
        renderCurrent();
      }
      hideModal('modalDelete');
      toast('已删除');
    });

    // 备份与恢复（合并的导出/导入入口）
    function openBackupModal(){
      $('backupCode').value = buildBackupCode();
      $('importCode').value = '';
      showModal('modalBackup');
    }
    $('btnBackup').addEventListener('click', function(){
      openBackupModal();
    });
    $('importFile').addEventListener('change', function(e){
      var file = e.target.files[0];
      if(file){ importBackup(file); }
      e.target.value = ''; // 允许重复导入同一文件
    });
    // 备份弹窗内的按钮
    $('btnCopyBackup').addEventListener('click', function(){
      copyText($('backupCode').value);
      toast('备份码已复制');
    });
    $('btnDownloadBackup').addEventListener('click', function(){
      if(state.recipes.length === 0){ toast('暂无配方可导出'); return; }
      exportBackup();
    });
    $('btnDoImport').addEventListener('click', function(){
      var raw = $('importCode').value;
      var data = parseBackupCode(raw);
      if(!data){ toast('备份码无效，请检查是否完整复制'); return; }
      if(!confirm('将导入 ' + data.recipes.length + ' 套配方，会覆盖当前所有数据，确定导入？')) return;
      applyImportData(data);
      hideModal('modalBackup');
    });
    $('btnImportFile2').addEventListener('click', function(){
      $('importFile').click();
    });

    // 分享
    $('btnShare').addEventListener('click', function(){
      var base = location.origin + location.pathname;
      $('shareLinkEmp').textContent   = base + '?role=staff';
      $('shareLinkAdmin').textContent = base;
      showModal('modalShare');
    });
    $('btnCopyEmp').addEventListener('click', function(){ copyText($('shareLinkEmp').textContent); });
    $('btnCopyAdmin').addEventListener('click', function(){ copyText($('shareLinkAdmin').textContent); });

    // 模态框关闭
    document.querySelectorAll('[data-close]').forEach(function(el){
      el.addEventListener('click', function(){
        var mask = el.closest('.modal-mask');
        if(mask) mask.classList.remove('show');
      });
    });
    document.querySelectorAll('.modal-mask').forEach(function(mask){
      mask.addEventListener('click', function(e){
        if(e.target === mask) mask.classList.remove('show');
      });
    });

    // 输入框仅允许数字
    document.addEventListener('input', function(e){
      if(e.target.classList && e.target.classList.contains('ing-input')){
        var v = e.target.value;
        var cleaned = v.replace(/[^\d.]/g, '');
        var parts = cleaned.split('.');
        if(parts.length > 2){ cleaned = parts[0] + '.' + parts.slice(1).join(''); }
        if(cleaned !== v) e.target.value = cleaned;
      }
    }, true);
  }

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('链接已复制'); })
        .catch(function(){ fallbackCopy(text); });
    } else { fallbackCopy(text); }
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('链接已复制'); }
    catch(e){ toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }

  function flashCard(){
    var card = ingredientList.closest('.card');
    if(card){
      card.classList.add('flash');
      setTimeout(function(){ card.classList.remove('flash'); }, 600);
    }
  }

  // 启动
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
</body>
